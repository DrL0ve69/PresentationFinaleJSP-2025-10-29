<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Modifier le profil')"></head>
<body style="padding-top: 60px;">

<div th:replace="fragments/client-nav :: clientNav"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-warning text-dark text-center">
                    <h3 class="h4 mb-0"><i class="bi bi-pencil-square me-2"></i> Modifier votre profil</h3>
                </div>
                <div class="card-body p-4">

                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/Home/profil/modifier}" th:object="${clientUpdate}" method="post" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="usernameDisplay" class="form-label">Nom d'utilisateur</label>
                            <input type="text" class="form-control" id="usernameDisplay"
                                   th:field="*{username}"
                                   readonly>
                            <small class="form-text text-muted">Le nom d'utilisateur est une clé unique et ne peut pas être modifié.</small>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email"
                                   th:field="*{email}"
                                   readonly>
                            <small class="form-text text-muted">L'email est une clé unique et ne peut pas être modifié.</small>
                        </div>

                        <div class="mb-3">
                            <label for="dateNaissance" class="form-label">Date de naissance</label>
                            <input type="date" class="form-control" id="dateNaissance"
                                   th:field="*{dateNaissance}"
                                   th:classappend="${#fields.hasErrors('dateNaissance') ? 'is-invalid' : ''}"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dateNaissance')}" th:errors="*{dateNaissance}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Nouveau mot de passe (Entrer vôtre ancien mot de passe pour ne pas le changer)</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="newPhoto" class="form-label">Nouvelle photo de profil (Optionnel)</label>
                            <input type="file" class="form-control" id="newPhoto" name="newPhoto" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-warning w-100 mt-3">Sauvegarder les modifications</button>
                    </form>

                    <div class="mt-3 text-center">
                        <a th:href="@{/Home/profil}" class="btn btn-link text-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Annuler et retour au profil
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
