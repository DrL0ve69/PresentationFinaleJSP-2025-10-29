<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head('Admin-produits')"></head>
<body>

<!-- Barre de navigation -->
<div th:replace="fragments/client-nav :: clientNav"></div>


<div class="container my-5">
    <h2 class="text-center mb-4">Gestion des produits</h2>
	<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#produitModal">
		Ajouter un produit
	</button>

    <!-- Tableau des produits -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prix</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${produits}">
                <td th:text="${p.idProduit}"></td>
                <td th:text="${p.nom}"></td>
                <td th:text="${p.prixUnitaire} + ' $'"></td>
                <td>
                    <img alt="Dam" th:if="${p.image != null}"
                         th:src="${p.image}"
                         class="img-thumbnail" style="max-width:80px; max-height:80px;"/>
                </td>
                <td>
                    <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#produitModal"
                            th:attrappend="
                                data-id=${p.idProduit},
                                data-nom=${p.nom},
                                data-prix=${p.prixUnitaire}">
                        Modifier
                    </button>
                    <a th:href="@{'/admin/produits/supprimer/' + ${p.idProduit}}"
                       onclick="return confirm('Voulez-vous vraiment supprimer ce produit ?');"
                       class="btn btn-sm btn-danger">Supprimer</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal pour ajouter/éditer un produit -->
    <div class="modal fade" id="produitModal" tabindex="-1" aria-labelledby="produitModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="produitModalLabel">Ajouter un produit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="produitForm" th:action="@{/admin/produits/ajouter}" method="post" enctype="multipart/form-data">

                        <input type="hidden" id="idProduit" name="idProduit">
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom</label>
                            <input type="text" class="form-control" id="nom" name="nom" required>
                        </div>
                        <div class="mb-3">
                            <label for="prixUnitaire" class="form-label">Prix unitaire</label>
                            <input type="number" class="form-control" id="prixUnitaire" name="prixUnitaire" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="imageFile" class="form-label">Image</label>
                            <input type="file" class="form-control" id="imageFile" name="imageFile">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="sun-fill" viewBox="0 0 16 16">
        <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-4.243a.5.5 0 0 1 0 .707l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.05a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.464a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707z"/>
    </symbol>
    <symbol id="moon-stars-fill" viewBox="0 0 16 16">
        <path d="M6 .278a.768.768 0 0 0-.153.243C3.563 1.83 1.813 4.189 1.813 6.885c0 2.536 1.25 4.908 3.56 6.47A1.56 1.56 0 0 0 6 14.939v-12A.768.768 0 0 0 5.847.278zM8.7 8.355a.903.903 0 0 0 .7.7h.547l-.147.284-.047.092a1 1 0 0 0 .73 1.488 1.045 1.045 0 0 0 1.258-.093l.361-.274-.15.347a.5.5 0 0 0 .328.665l.383.143a.65.65 0 0 0 .723-.194l.111-.194a.654.654 0 0 0 .194-.723l-.143-.383a.5.5 0 0 0-.665-.328l-.347.15c.01-.005.02-.01.026-.014a1.04 1.04 0 0 0 0-.916 1.002 1.002 0 0 0-1.488-.73l-.092.047-.284.147h-.547a.9.9 0 0 0-.7.7z"/>
    </symbol>
    <symbol id="circle-half" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
    </symbol>
</svg>

<div class="dropdown position-fixed bottom-0 start-0 mb-3 ms-3" id="bd-theme-toggle" style="z-index: 1100;">
    <button class="btn btn-bd-primary dropdown-toggle d-flex align-items-center"
            id="bd-theme"
            type="button"
            aria-expanded="false"
            data-bs-toggle="dropdown"
            aria-label="Toggle theme (auto)">
        <svg class="bi theme-icon-active me-2 opacity-50" width="1em" height="1em" fill="currentColor">
            <use href="#sun-fill"></use>
        </svg>
        <span id="bd-theme-text">Thème</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-start shadow" aria-labelledby="bd-theme">
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
                <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em" fill="currentColor"><use href="#sun-fill"></use></svg>
                Light
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
                <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em" fill="currentColor"><use href="#moon-stars-fill"></use></svg>
                Dark
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="auto" aria-pressed="true">
                <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em" fill="currentColor"><use href="#circle-half"></use></svg>
                Auto
            </button>
        </li>
    </ul>
</div>


<footer class="bg-dark text-white-50 py-3 mt-5 border-top border-primary border-3">
    <div class="container text-center">
        <p class="mb-0">
            &copy; 2025 MonShop. Tous droits réservés. | Copyright
        </p>
    </div>
</footer>

<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
    <div id="panier-toast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="panier-toast-body">Produit ajouté !</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<a th:href="@{/panier/afficherPanier}"
   class="btn btn-primary shadow-lg d-flex align-items-center"
   style="
       position: fixed;
       bottom: 20px;
       right: 20px;
       z-index: 1100;
       border-radius: 50px;
       padding: 0.75rem 1.25rem;
       font-size: 1.1rem;
   ">
    <i class="bi bi-cart3 me-2 fs-5"></i>
    <span class="d-none d-sm-inline">Voir le panier</span>
    <span class="badge bg-warning text-dark ms-2" id="panier-count-floating">0</span>
</a>
<!-- Bootstrap JS via CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script>
    // Initialisation du modal avec les données du produit
    var produitModal = document.getElementById('produitModal');
    produitModal.addEventListener('show.bs.modal', function (event)
    {
        var button = event.relatedTarget;
        var idProduit = button.getAttribute('data-id');
		console.log(idProduit)
        var nom = button.getAttribute('data-nom');
        var prixUnitaire = button.getAttribute('data-prix');

        var modalTitle = produitModal.querySelector('.modal-title');
        var modalForm = produitModal.querySelector('form');
        var modalIdInput = modalForm.querySelector('#idProduit');
        var modalNomInput = modalForm.querySelector('#nom');
        var modalPrixInput = modalForm.querySelector('#prixUnitaire');

        modalTitle.textContent = idProduit ? 'Modifier le produit' : 'Ajouter un produit';
        modalIdInput.value = idProduit || '';
        modalNomInput.value = nom || '';
        modalPrixInput.value = prixUnitaire || '';
        modalForm.action = idProduit ? '/ProjetPrimeJSP/admin/produits/modifier' : '/ProjetPrimeJSP/admin/produits/ajouter';
    });


    // Ajuster le compte
    async function updatePanierCount() {
        try {
            const response = await fetch('/ProjetPrimeJSP/panier/count');
            if(!response.ok) throw new Error('Erreur récupération count');
            const count = await response.json();
            console.log(count)

            const badge = document.getElementById('panier-count');
            //const badgeFloating = document.getElementById('panier-count-floating');
            // Ajouter les éléments du panier aussi
            if(badge) badge.textContent = count;
            //if(badgeFloating) badgeFloating.textContent = count;

        } catch (error) {
            console.error('Erreur updatePanierCount:', error);
        }
    }


    document.addEventListener('DOMContentLoaded', () =>
    {

        updatePanierCount(); // Toujours mettre à jour le badge si présent
    });
</script>
</body>
</html>
