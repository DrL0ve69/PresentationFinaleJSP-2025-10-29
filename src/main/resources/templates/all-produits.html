<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head('Tous nos produits')"></head>
<style>
    /* 1. Container qui peut se scroll */
    .catalogue-wrapper {
        min-height: 80vh;
        padding-top: 2rem;
        padding-bottom: 2rem;
    }

    .product-list-card .card-img-container
    {
        /* Horizontal */
        height: 100%;
        min-height: 150px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .product-list-card img
    {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* 3. 2x2 pour le display large */
    @media (min-width: 992px)
    {
        .product-list-card {

        }
    }
</style>

<body style="padding-top: 100px;">
<div th:replace="fragments/client-nav :: clientNav"></div>

<main class="container mt-5">

    <h1 class="text-center mb-5 text-primary">Catalogue complet des produits:</h1>

    <div class="container catalogue-wrapper">
        <div class="row g-4">
            <div class="col-xl-6 col-lg-6" th:each="produit : ${produits}">

                <div class="card h-100 shadow product-list-card">
                    <div class="row g-0">

                        <div class="col-md-5 d-flex align-items-center justify-content-center">
                            <div class="card-img-container">
                                <img th:if="${produit.image != null}"
                                     th:src="${produit.image}"
                                     class="img-fluid rounded-start"
                                     th:alt="${'Image of ' + produit.nom}">

                                <div th:if="${produit.image == null}" class="bg-secondary text-center text-white p-4 h-100 w-100 d-flex align-items-center justify-content-center">
                                    <span>No image available</span>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-7">
                            <div class="card-body d-flex flex-column h-100">
                                <h5 class="card-title fw-bold" th:text="${produit.nom}">Produit</h5>
                                <p class="card-text text-muted">Description ici. Je suis un produit</p>

                                <div class="mt-auto pt-2">
                                    <p class="fs-4 fw-bolder text-success mb-2"
                                       th:text="${#numbers.formatDecimal(produit.prixUnitaire, 0, 'COMMA', 2, 'POINT')} + ' $'">$0.00
                                    </p>

                                    <a href="javascript:void(0)" class="btn btn-primary w-100 js-add-to-cart" th:attr="data-id=${produit.idProduit}">
                                        <i class="bi bi-cart-plus"></i> Ajouter au panier
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
