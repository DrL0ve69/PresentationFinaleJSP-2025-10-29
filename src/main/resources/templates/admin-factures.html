<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head('Gestion des Factures')"></head>
<body style="padding-top: 60px;">

<div th:replace="fragments/client-nav :: clientNav"></div>

<main class="container my-5">
    <h2 class="mb-4 text-primary"><i class="bi bi-receipt-cutoff me-2"></i> Gestion des Factures</h2>
    <hr>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Client (Username)</th>
                <th>Date d'Achat</th>
                <th class="text-end">Montant Total</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="facture : ${factures}">
                <td th:text="${facture.idFacture}">1001</td>
                <td th:text="${facture.usernameClient}">client_user</td>
                <td th:text="${#temporals.format(facture.dateAchat, 'yyyy-MM-dd')}">2025-10-27</td>
                <td class="text-end">
                    <span th:text="${#numbers.formatDecimal(facture.montantTotal, 0, 'COMMA', 2, 'POINT')} + ' $'">55.00 $</span>
                </td>
                <td>


                    <button class="btn btn-sm btn-outline-primary me-2"
                            data-bs-toggle="modal"
                            th:data-bs-target="'#modalFacture' + ${facture.idFacture}">
                        <i class="bi bi-eye"></i> Détails
                    </button>

                    <!-- Link to delete invoice (Requires controller method) -->
                    <a th:href="@{/admin/factures/supprimer/{id}(id=${facture.idFacture})}"
                       class="btn btn-sm btn-outline-danger"
                       th:onclick="|return confirm('Êtes-vous sûr de vouloir supprimer la facture N° ${facture.idFacture} ?')|"
                       title="Supprimer la facture">
                        <i class="bi bi-x-circle"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:each="facture : ${factures}" class="modal fade" th:id="'modalFacture' + ${facture.idFacture}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-receipt me-2"></i> Détails de la Facture #<span th:text="${facture.idFacture}"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-6">
                            **Client :** <span th:text="${facture.usernameClient}"></span>
                        </div>
                        <div class="col-6 text-end">
                            **Date :** <span th:text="${#temporals.format(facture.dateAchat, 'dd MMMM yyyy')}"></span>
                        </div>
                    </div>

                    <h6>**Produits commandés (Snapshot) :**</h6>
                    <pre class="bg-light p-3 text-black border rounded text-wrap" th:text="${facture.produits}"></pre>

                    <p class="mt-3 text-end">
                        **Montant Total :** <span class="fw-bold text-success fs-5"
                                                  th:text="${#numbers.formatDecimal(facture.montantTotal, 0, 'COMMA', 2, 'POINT')} + ' $'">99.99 $</span>
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
