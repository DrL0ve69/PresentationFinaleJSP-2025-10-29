<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head('Accueil')"></head>

<body>
<div th:replace="fragments/client-nav :: clientNav"></div>

<main class="container mt-5 pt-5" id="main-content">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title mb-4 text-center">Créer un compte</h3>

                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                        <form th:action="@{/Home/register}" th:object="${client}" method="post" enctype="multipart/form-data">

                            <div class="mb-3">
                                <label for="username" class="form-label">Nom d'utilisateur</label>
                                <input type="text" class="form-control" id="username"
                                       th:field="*{username}"
                                       th:classappend="${#fields.hasErrors('username') or (!#strings.isEmpty(errorMessage) and #strings.contains(errorMessage, 'utilisateur')) ? 'is-invalid' : ''}"
                                       required>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                                </div>
                                <div class="invalid-feedback"
                                     th:if="${!#strings.isEmpty(errorMessage) and #strings.contains(errorMessage, 'utilisateur')}"
                                     th:text="${errorMessage}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email"
                                       th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email') or (!#strings.isEmpty(errorMessage) and #strings.contains(errorMessage, 'email')) ? 'is-invalid' : ''}"
                                       required>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                </div>
                                <div class="invalid-feedback"
                                     th:if="${!#strings.isEmpty(errorMessage) and #strings.contains(errorMessage, 'email')}"
                                     th:text="${errorMessage}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="dateNaissance" class="form-label">Date de naissance</label>
                                <input type="date" class="form-control" id="dateNaissance"
                                       name="dateNaissance"
                                       th:value="${client.dateNaissance != null ? #temporals.format(client.dateNaissance, 'yyyy-MM-dd') : ''}"
                                       th:classappend="${#fields.hasErrors('dateNaissance') ? 'is-invalid' : ''}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dateNaissance')}" th:errors="*{dateNaissance}"></div>
                            </div>


                            <div class="mb-3">
                                <label for="password" class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" id="password"
                                       th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="photo" class="form-label">Photo de profil (Optionnel)</label>
                                <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                            </div>

                            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
                        </form>

                        <div class="mt-3 text-center">
                            <a th:href="@{/Home/login}">Déjà un compte ? Connectez-vous</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
